mqtt:
  enabled: true
  host: 192.168.77.1
  port: 1883
  user: frigatexps
  password: 5p2Fa4TJYflOUbXN8znn
  # client_id ОБЯЗАТЕЛЕН явно, отдельно от topic_prefix: Frigate по умолчанию использует
  # захардкоженный client_id "frigate" независимо от topic_prefix — с двумя инстансами на
  # одном брокере это коллизия (MQTT-спека не даёт двум клиентам с одинаковым client_id
  # быть подключёнными одновременно, брокер выталкивает более старого) — оба инстанса
  # входят в бесконечный цикл переподключений ("MQTT disconnected" каждые ~2с), обнаружено
  # именно так при первом запуске.
  client_id: frigate-xps
  topic_prefix: frigate2

face_recognition:
  # 2026-09-03: эксперимент — раньше было выключено (не нужно presence-камере), включаем
  # проверить как работает на изолированном инстансе, ничем не рискуя. Своих лиц пока не
  # обучено — сначала посмотрим, что покажет "Unknown"/детекция лица как таковая, обучение
  # (Frigate UI → Face Library) отдельный следующий шаг, если распознавание нужно всерьёз.
  enabled: true

detectors:
  # 2026-09-03: эксперимент — замена дефолтного CPU-детектора (TFLite, ~92% одного ядра в
  # среднем, сам Frigate предупреждает "not recommended") на OpenVINO — оптимизированный
  # инференс-движок Intel, использует AVX2 (у Ultradell i7-4790 есть) намного эффективнее,
  # чем обычный TFLite CPU-делегат, даже без выделенного NPU/GPU. Модель ssdlite_mobilenet_v2
  # уже вшита в образ Frigate (/openvino-model/) — доп. скачивание не требуется.
  # device не указан явно — OpenVINO сам выбирает CPU по умолчанию, не трогаем GPU
  # (renderD128 и так занят VAAPI-кодированием у всех камер, не хотим конкуренции).
  ov:
    type: openvino
    # device ОБЯЗАТЕЛЕН явно — в коде Frigate (detection_runners.py) None не подставляется
    # дефолтом сам, падает на self.ov_core.set_property(None, ...) с TypeError, весь
    # процесс детектора крашится, watchdog глушит Frigate целиком ("Detection appears to
    # have stopped. Exiting Frigate..."). Обнаружено именно так при первом включении.
    device: CPU

model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  model_type: ssd

go2rtc:
  streams:
    xps:
      # 2026-09-03: XPS переключён с Ethernet на Wi-Fi. Wi-Fi IP на этой машине — 10.0.0.9,
      # сеть Bezeq/"home" (не 192.168.77.0/24, где живёт сам frigate-xps) — Ультраделл
      # достаёт её напрямую через wlp3s0/eno1.10 (те же 10.0.0.0/24), проверено nc на 8554.
      - rtsp://10.0.0.9:8554/xps

ffmpeg:
  hwaccel_args: []

environment_vars:
  LIBVA_DRIVER_NAME: i965

cameras:
  xps:
    ffmpeg:
      output_args:
        record: -f segment -segment_time 10 -segment_format mp4 -reset_timestamps 1 -strftime 1 -vf format=nv12,hwupload -vaapi_device /dev/dri/renderD128 -c:v h264_vaapi -qp 23 -an
        detect: -r 5 -vf fps=5,scale=640:480,format=yuv420p -threads 2 -f rawvideo -pix_fmt yuv420p
      inputs:
        - path: rtsp://127.0.0.1:8554/xps
          input_args: preset-rtsp-restream
          roles: [detect, record]
    live:
      streams:
        # Без конкретного разрешения в названии намеренно — реальное качество переключается
        # динамически из HA (input_select.xps_webcam_resolution) без рестарта этого Frigate,
        # статичная подпись с числом быстро устареет (см. device_credentials/xps.txt, урок
        # с первым Frigate-инстансом).
        "XPS": xps
    detect:
      enabled: true
      width: 640
      height: 480
    objects:
      track:
        - person
    record:
      enabled: true
      continuous:
        days: 7
      alerts:
        retain:
          days: 30
    snapshots:
      enabled: true
      retain:
        default: 30
